<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Defense Flashcards</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .flashcard-wrapper {
            perspective: 1000px; /* For 3D flip effect */
            height: 250px; /* Fixed height for flashcard */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fdfdfd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 1.3em;
            line-height: 1.6;
            box-sizing: border-box;
            word-wrap: break-word; /* Ensure long words break */
            white-space: pre-wrap; /* Preserve whitespace and allow wrapping */
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background-color: #e8f5e9; /* Light green for answer */
            color: #2e7d32;
        }

        .flashcard-front {
            background-color: #e3f2fd; /* Light blue for question */
            color: #1976d2;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        button {
            background-color: #4CAF50; /* Green */
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            margin: 0 10px;
            min-width: 120px;
        }

        button:hover:not(:disabled) {
            background-color: #45a049;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .card-counter {
            font-size: 1.1em;
            font-weight: 500;
            color: #555;
            min-width: 80px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 2.2em;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .flashcard-front, .flashcard-back {
                font-size: 1.1em;
            }
            button {
                padding: 10px 15px;
                font-size: 0.9em;
            }
            .controls {
                flex-direction: column;
            }
            button {
                margin: 10px 0;
            }
            .card-counter {
                margin-top: 15px;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="flashcard-wrapper">
            <div id="flashcard" class="flashcard">

                <div class="flashcard-back" id="answer"></div>
            </div>
        </div>
        <div class="controls">
            <button id="prevBtn" disabled>Previous</button>
            <button id="flipBtn">Flip Card</button>
            <button id="nextBtn">Next</button>
        </div>
        <div class="card-counter" id="cardCounter"></div>
    </div>

        ];

        let currentCardIndex = 0;
        const flashcardElement = document.getElementById('flashcard');
        const questionElement = document.getElementById('question');
        const answerElement = document.getElementById('answer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const flipBtn = document.getElementById('flipBtn');
        const cardCounterElement = document.getElementById('cardCounter');

        function updateCardDisplay() {
            const card = flashcardsData[currentCardIndex];
            questionElement.textContent = card.question;
            answerElement.textContent = card.answer;
            flashcardElement.classList.remove('flipped'); // Ensure card is question-side up

            prevBtn.disabled = currentCardIndex === 0;
            nextBtn.disabled = currentCardIndex === flashcardsData.length - 1;
            cardCounterElement.textContent = `Card ${currentCardIndex + 1} of ${flashcardsData.length}`;
        }

        flashcardElement.addEventListener('click', () => {
            flashcardElement.classList.toggle('flipped');
        });

        flipBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent card click event from firing twice
            flashcardElement.classList.toggle('flipped');
        });

        nextBtn.addEventListener('click', () => {
            if (currentCardIndex < flashcardsData.length - 1) {
                currentCardIndex++;
                updateCardDisplay();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCardDisplay();
            }
        });

        // Initialize the first card
        updateCardDisplay();
    </script>
</body>
</html>
