<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebelik Tez Savunması - Bilgi Kartları</title>
    <meta name="description" content="Ebelik tez savunması hazırlık kartları - Ebelik Yönetmeliği ve uygulamaları">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-rose: #E8B4BC;
            --primary-coral: #F4A7B9;
            --primary-blush: #FFDEE2;
            --accent-teal: #7BC5C1;
            --accent-sage: #A8D5BA;
            --text-dark: #4A4A4A;
            --text-muted: #6B7280;
            --background-warm: #FFF9FA;
            --card-shadow: 0 20px 60px rgba(244, 167, 185, 0.2);
            --button-shadow: 0 8px 25px rgba(123, 197, 193, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: var(--background-warm);
            background-image: 
                radial-gradient(ellipse at 20% 80%, rgba(232, 180, 188, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(123, 197, 193, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 222, 226, 0.2) 0%, transparent 70%);
            color: var(--text-dark);
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative floating elements */
        .decoration {
            position: fixed;
            pointer-events: none;
            opacity: 0.08;
            z-index: 0;
        }

        .decoration-1 {
            top: 10%;
            left: 5%;
            font-size: 120px;
            animation: float 6s ease-in-out infinite;
        }

        .decoration-2 {
            bottom: 15%;
            right: 8%;
            font-size: 100px;
            animation: float 8s ease-in-out infinite reverse;
        }

        .decoration-3 {
            top: 60%;
            left: 8%;
            font-size: 80px;
            animation: float 7s ease-in-out infinite 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-coral), var(--accent-teal));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 30px rgba(244, 167, 185, 0.3);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(244, 167, 185, 0.3); }
            50% { transform: scale(1.03); box-shadow: 0 15px 40px rgba(244, 167, 185, 0.4); }
        }

        .logo-icon svg {
            width: 45px;
            height: 45px;
            fill: white;
        }

        h1 {
            color: var(--text-dark);
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 8px;
            font-weight: 500;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            padding: 35px;
            max-width: 720px;
            width: 100%;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .progress-wrapper {
            margin-bottom: 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .progress-bar {
            height: 8px;
            background: var(--primary-blush);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-coral), var(--accent-teal));
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard-wrapper {
            perspective: 1200px;
            height: 280px;
            margin-bottom: 25px;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            border-radius: 20px;
        }

        .flashcard:hover {
            transform: scale(1.01);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard.flipped:hover {
            transform: rotateY(180deg) scale(1.01);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-size: 1.15rem;
            line-height: 1.7;
            border-radius: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .flashcard-front {
            background: linear-gradient(145deg, #fff5f6 0%, var(--primary-blush) 100%);
            color: #7D4E57;
            border: 2px solid rgba(244, 167, 185, 0.3);
        }

        .flashcard-front::before {
            content: "❓";
            font-size: 1.5rem;
            margin-bottom: 15px;
            opacity: 0.7;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #f0faf8 0%, #e6f7f5 100%);
            color: #3D6B67;
            border: 2px solid rgba(123, 197, 193, 0.3);
        }

        .flashcard-back::before {
            content: "✓";
            font-size: 1.5rem;
            margin-bottom: 15px;
            opacity: 0.7;
        }

        .tap-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, var(--accent-teal), #5DB5B0);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--button-shadow);
            min-width: 130px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(123, 197, 193, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            background: #D1D5DB;
            cursor: not-allowed;
            box-shadow: none;
        }

        #flipBtn {
            background: linear-gradient(135deg, var(--primary-coral), #E8929F);
            box-shadow: 0 8px 25px rgba(244, 167, 185, 0.3);
        }

        #flipBtn:hover:not(:disabled) {
            box-shadow: 0 12px 35px rgba(244, 167, 185, 0.4);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: var(--accent-teal);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px 20px;
            }
            
            .flashcard-wrapper {
                height: 300px;
            }
            
            .flashcard-front, .flashcard-back {
                font-size: 1rem;
                padding: 25px 20px;
            }
            
            button {
                padding: 12px 24px;
                font-size: 0.95rem;
                min-width: 110px;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .logo-icon {
                width: 65px;
                height: 65px;
            }
            
            .decoration {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative elements -->
    <div class="decoration decoration-1">👶</div>
    <div class="decoration decoration-2">💕</div>
    <div class="decoration decoration-3">🤱</div>

    <div class="header">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
        <h1>Ebelik Tez Savunması</h1>
        <p class="subtitle">Bilgi Kartları ile Hazırlık</p>
    </div>

    <div class="container">
        <div class="progress-wrapper">
            <div class="progress-info">
                <span class="progress-label">İlerleme</span>
                <span class="progress-label" id="cardCounter">1 / 93</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 1%"></div>
            </div>
        </div>

        <div class="flashcard-wrapper">
            <div id="flashcard" class="flashcard">
                <div class="flashcard-front" id="question">
                    <span class="tap-hint">Cevabı görmek için tıklayın</span>
                </div>
                <div class="flashcard-back" id="answer">
                    <span class="tap-hint">Soruya dönmek için tıklayın</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn" disabled>← Önceki</button>
            <button id="flipBtn">Çevir</button>
            <button id="nextBtn">Sonraki →</button>
        </div>
    </div>

    <div class="footer">
        <p>🌸 Ebelik eğitimi için özenle hazırlandı 🌸</p>
    </div>

    <script>
        // CSV data will be loaded from flashcards.csv in the same directory
        let flashcardsData = [];
        let currentCardIndex = 0;

        const flashcardElement = document.getElementById('flashcard');
        const questionElement = document.getElementById('question');
        const answerElement = document.getElementById('answer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const flipBtn = document.getElementById('flipBtn');
        const cardCounterElement = document.getElementById('cardCounter');
        const progressFill = document.getElementById('progressFill');

        // Parse CSV function
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const data = [];
            
            for (let line of lines) {
                // Handle quoted fields with commas
                const matches = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                if (matches && matches.length >= 2) {
                    const question = matches[0].replace(/^"|"$/g, '').replace(/""/g, '"');
                    const answer = matches.slice(1).join(',').replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                    data.push({ question, answer });
                }
            }
            return data;
        }

        // Load CSV file
        async function loadFlashcards() {
            try {
                const response = await fetch('flashcards.csv');
                const text = await response.text();
                flashcardsData = parseCSV(text);
                updateCardDisplay();
            } catch (error) {
                console.error('Error loading flashcards:', error);
                flashcardsData = [{ question: 'CSV dosyası yüklenemedi', answer: 'Lütfen flashcards.csv dosyasının mevcut olduğundan emin olun.' }];
                updateCardDisplay();
            }
        }

        function updateCardDisplay() {
            if (flashcardsData.length === 0) return;
            
            const card = flashcardsData[currentCardIndex];
            questionElement.childNodes[0] ? questionElement.childNodes[0].textContent = '' : null;
            answerElement.childNodes[0] ? answerElement.childNodes[0].textContent = '' : null;
            
            // Keep the tap hint and update content
            questionElement.innerHTML = card.question + '<span class="tap-hint">Cevabı görmek için tıklayın</span>';
            answerElement.innerHTML = card.answer + '<span class="tap-hint">Soruya dönmek için tıklayın</span>';
            
            flashcardElement.classList.remove('flipped');

            prevBtn.disabled = currentCardIndex === 0;
            nextBtn.disabled = currentCardIndex === flashcardsData.length - 1;
            cardCounterElement.textContent = `${currentCardIndex + 1} / ${flashcardsData.length}`;
            
            // Update progress bar
            const progress = ((currentCardIndex + 1) / flashcardsData.length) * 100;
            progressFill.style.width = `${progress}%`;
        }

        flashcardElement.addEventListener('click', () => {
            flashcardElement.classList.toggle('flipped');
        });

        flipBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            flashcardElement.classList.toggle('flipped');
        });

        nextBtn.addEventListener('click', () => {
            if (currentCardIndex < flashcardsData.length - 1) {
                currentCardIndex++;
                updateCardDisplay();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                updateCardDisplay();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentCardIndex < flashcardsData.length - 1) {
                currentCardIndex++;
                updateCardDisplay();
            } else if (e.key === 'ArrowLeft' && currentCardIndex > 0) {
                currentCardIndex--;
                updateCardDisplay();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flashcardElement.classList.toggle('flipped');
            }
        });

        // Initialize
        loadFlashcards();
    </script>
</body>
</html>
